<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mowes-next</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      margin: 2rem;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      max-width: 760px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }
    h1 { margin-top: 0; }
    .muted { color: #475569; }
    #apps { margin-top: 1rem; }
    #app-links { margin: 0.4rem 0 0; padding-left: 1.25rem; }
    #app-links li { margin: 0.2rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Willkommen bei mowes-next {{MOWES_VERSION}}</h1>
    <p><strong>Apache-Version:</strong> <span id="apache-version">wird geladen...</span></p>
    <p><strong>MariaDB-Version:</strong> <span id="mariadb-version">wird geladen...</span></p>
    <p><strong>Datenbanken:</strong> <span id="db-names">{{DATABASE_NAMES}}</span></p>
    <div id="apps" hidden>
      <p><strong>Installierte Web-Apps:</strong></p>
      <ul id="app-links"></ul>
    </div>
    <p class="muted">Die Versionen werden live aus versions.json der aktuell laufenden Runtime geladen.</p>
  </div>
  <script>
    fetch('/versions.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (v) {
        document.getElementById('apache-version').textContent = v.apache || 'unbekannt';
        document.getElementById('mariadb-version').textContent = v.mariadb || 'unbekannt';
      })
      .catch(function () {
        document.getElementById('apache-version').textContent = 'unbekannt';
        document.getElementById('mariadb-version').textContent = 'unbekannt';
      });

    function addAppLink(path, label) {
      var ul = document.getElementById('app-links');
      var li = document.createElement('li');
      var a = document.createElement('a');
      var url = new URL(path, window.location.origin).href;
      a.href = url;
      a.textContent = label + ' (' + url + ')';
      li.appendChild(a);
      ul.appendChild(li);
      document.getElementById('apps').hidden = false;
    }

    function detectInstalledApp(path, label) {
      return fetch(path, { cache: 'no-store' })
        .then(function (response) {
          // 2xx/3xx/4xx (außer 404) deuten auf vorhandenen Endpoint hin.
          if (response.status !== 404 && response.status < 500) {
            addAppLink(path, label);
          }
        })
        .catch(function () {
          // Kein Link, wenn der Endpoint nicht erreichbar ist.
        });
    }

    Promise.all([
      detectInstalledApp('/wordpress/', 'WordPress'),
      detectInstalledApp('/phpmyadmin/', 'phpMyAdmin'),
      detectInstalledApp('/oswebinterface/', 'oswebinterface')
    ]);
  </script>
</body>
</html>
