[package]
name = "mowes-next"
version = "26.5.0"
edition = "2024"
default-run = "mowes-next"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = "2"
eframe = "0.29"
rfd = "0.15"

[[bin]]
name = "mowes-next"
path = "src/main.rs"

[[bin]]
name = "mowes-builder"
path = "src/bin/mowes-builder.rs"

[[bin]]
name = "mowes-ui"
path = "src/bin/mowes-ui.rs"
